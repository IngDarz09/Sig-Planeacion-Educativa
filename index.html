document.getElementById('input-busqueda').addEventListener('input', function(e) {
    var texto = e.target.value.toLowerCase();
    var lista = document.getElementById('lista-sugerencias');
    lista.innerHTML = ''; 

    if (!texto) return; 

    var coincidencias = [];

    map.eachLayer(function(layer) {
        if (layer.feature && layer.feature.properties) {
            
            // FILTRO DE CAPA: Solo entra si es la capa de municipios
            // qgis2web suele guardar el nombre en layer.options.layerName o en el título
            var nombreCapa = layer.options ? (layer.options.layerName || layer.options.title || "") : "";
            
            // Si la capa no contiene la palabra 'municip' o 'divis', pasamos a la siguiente capa
            // Nota: Si notas que no busca nada, borra temporalmente esta condición if para revisar el nombre exacto
            if (nombreCapa && !nombreCapa.toLowerCase().includes('municip') && !nombreCapa.toLowerCase().includes('divis')) {
                return; 
            }

            var props = layer.feature.properties;
            
            // Buscamos específicamente en las columnas comunes de nombres de qgis2web
            // NOM_MUN o NOM_MUNICI son las estándar de los mapas del INEGI / Puebla
            var nombreMunicipio = props.NOM_MUN || props.NOM_MUNICI || props.municipio || props.Nombre || "";
            
            if (nombreMunicipio && typeof nombreMunicipio === 'string' && nombreMunicipio.toLowerCase().includes(texto)) {
                var yaExiste = coincidencias.some(function(item) {
                    return item.nombre.toLowerCase() === nombreMunicipio.toLowerCase();
                });

                if (!yaExiste) {
                    coincidencias.push({
                        nombre: nombreMunicipio,
                        layer: layer
                    });
                }
            }
        }
    });

    // Desplegamos las sugerencias filtradas
    coincidencias.forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'sugerencia-item';
        div.textContent = item.nombre;
        
        div.onclick = function() {
            if (typeof item.layer.getBounds === 'function') {
                map.fitBounds(item.layer.getBounds(), { padding: [50, 50] });
            }
                        // 1. Hace zoom automático a la geometría del polígono de la sugerencia
            if (typeof item.layer.getBounds === 'function') {
                map.fitBounds(item.layer.getBounds(), { padding: [50, 50] });
            }
            
            // NUEVO: SIMULA EL EFECTO VISUAL DE RESALTADO (HOVER/HIGHLIGHT)
            if (typeof item.layer.setStyle === 'function') {
                // Restablece primero cualquier polígono que haya estado iluminado antes
                map.eachLayer(function(l) {
                    if (l.feature && typeof l.setStyle === 'function') {
                        // Devuelve el diseño original a todas las capas
                        if (typeof l.resetStyle === 'function') { l.resetStyle(l); }
                    }
                });

                                // Ilumina TODO el cuerpo del municipio buscado
                item.layer.setStyle({
                    weight: 3,               /* Grosor del borde */
                    color: '#ffc600',        /* Color del borde amarillo dorado */
                    opacity: 1,              /* Opacidad del borde */
                    fillColor: '#ffc600',    /* NUEVO: Color de relleno interno (un amarillo más sólido) */
                    fillOpacity: 0.85,       /* NUEVO: Opacidad del relleno (0 es transparente, 1 es sólido) */
                    dashArray: ''
                });
                
                // Trae el polígono al frente para que resalte sobre los demás
                if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                    item.layer.bringToFront();
                }
            }
                        // NUEVO: Guarda el estilo original antes de pintar de amarillo
            if (!item.layer.estiloOriginal) {
                item.layer.estiloOriginal = Object.assign({}, item.layer.options);
            }

            // 2. Dispara el clic simulado para rellenar tu panel guinda al instante
            item.layer.fire('click');

            item.layer.fire('click');
            
            document.getElementById('input-busqueda').value = item.nombre;
            lista.innerHTML = '';
        };
        lista.appendChild(div);
    });
});

    var panelInfo = document.getElementById('panel-informacion');
    if (panelInfo) {
        panelInfo.innerHTML = '<h3>Información</h3><p style="color: #666;">Selecciona un polígono para ver sus datos.</p>';
    }
    
    // 4. DESPINTADO REFORZADO CON REDIBUJADO INMEDIATO
    map.eachLayer(function(l) {
        if (l.feature) {
            var nombreCapa = l.options ? (l.options.layerName || l.options.title || "") : "";
            
            // Si es la capa de División Municipal, la reiniciamos
            if (nombreCapa && (nombreCapa.toLowerCase().includes('municip') || nombreCapa.toLowerCase().includes('divis'))) {
                var mapaPadre = l._map; 
                if (mapaPadre) {
                    mapaPadre.removeLayer(l); // La borra con todo y el color amarillo
                    mapaPadre.addLayer(l);    // La vuelve a agregar limpia
                    
                    // FORZADO VISUAL: Obliga a Leaflet a recalcular y pintar en pantalla los estilos de origen inmediatamente
                    if (typeof l.refresh === 'function') {
                        l.refresh();
                    } else if (typeof l.setStyle === 'function') {
                        l.setStyle({}); // Un setStyle vacío obliga a la capa a redibujarse con sus estilos por defecto
                    }
                }
            } else {
                // A las demás capas (Macrorregiones) solo les aplicamos el reset estándar
                if (typeof l.resetStyle === 'function') { 
                    l.resetStyle(l); 
                }
            }
        }
    });

    // Pequeño truco extra: Simulamos un micro-movimiento imperceptible en el mapa
    // Esto obliga al motor de Leaflet a refrescar visualmente toda la pantalla de golpe
    setTimeout(function() {
        map.invalidateSize();
    }, 50);
}
        </script>        
    </body>
</html>
